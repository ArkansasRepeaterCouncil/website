# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP app to Azure Web App - arkansasrepeatercouncil

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore packages.config -OutputDirectory packages

      - name: Copy assemblies to Bin
        run: |
          Copy-Item "packages\Newtonsoft.Json.13.0.2\lib\net45\Newtonsoft.Json.dll" -Destination "Bin\" -Force
          Copy-Item "packages\Octokit.4.0.4\lib\netstandard2.0\Octokit.dll" -Destination "Bin\" -Force
          Copy-Item "packages\AjaxControlToolkit.20.1.0\lib\net40\AjaxControlToolkit.dll" -Destination "Bin\" -Force
          # Copy the netstandard façade so .NET 4.8 can resolve Octokit's netstandard2.0 dependency
          $facade = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8\Facades\netstandard.dll"
          if (Test-Path $facade) { Copy-Item $facade -Destination "Bin\" -Force }

      - name: Compile with aspnet_compiler
        run: |
          $compiler = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\aspnet_compiler.exe"
          & $compiler -v /localhost_50427 -p "$env:GITHUB_WORKSPACE" -u -f "$env:GITHUB_WORKSPACE\published"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: '${{ github.workspace }}\published'
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BB49D369757544258C26EED8AA250246 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_06E3191BB1514A98AA6B0969C9EE106C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_02C56AE706A343FB98FAD35520F7F204 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'arkansasrepeatercouncil'
          slot-name: 'Production'
          package: .
          
